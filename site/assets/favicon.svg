<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- No plate behind it: the mark sits on whatever the browser paints its tab
       strip with, so it reads on a light and a dark one alike. With the plate
       gone the padding it needed goes too, and the mark fills the square. -->
  <g transform="translate(16 16) scale(1.34) translate(-15.7 -16.2)">
    <g stroke="#8b857f" stroke-width="1.6" stroke-linecap="round">
      <line x1="9" y1="10" x2="23" y2="9"/>
      <line x1="10.5" y1="12" x2="16" y2="22"/>
      <line x1="22" y1="11" x2="17" y2="22"/>
    </g>
    <circle cx="9" cy="10" r="4" fill="#5375cd"/>
    <circle cx="23" cy="9" r="3.4" fill="#c6701e"/>
    <circle cx="16.2" cy="23" r="3.4" fill="#009a73"/>
  </g>
</svg>
